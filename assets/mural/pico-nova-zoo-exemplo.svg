<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Imagem de exemplo — Pico da Nova Zoo, Pampulha, BH">
  <defs>
    <clipPath id="frame"><rect width="1600" height="900"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <!-- céu roxo da marca -->
    <rect width="1600" height="900" fill="#935bbc"/>
    <!-- sol amarelo -->
    <circle cx="1230" cy="230" r="120" fill="#f6c707"/>
    <!-- faixa ciano (transição/chão liso) -->
    <path d="M0 640 Q 400 560 800 620 T 1600 600 L1600 900 L0 900 Z" fill="#18d7df"/>
    <!-- morros bege (parque/zoo) -->
    <path d="M0 700 Q 300 600 620 690 T 1600 670 L1600 900 L0 900 Z" fill="#e8d4bf" opacity="0.9"/>
    <!-- árvores simples (parque) -->
    <g fill="#000">
      <rect x="300" y="600" width="16" height="90"/><circle cx="308" cy="590" r="46" fill="#000"/>
      <rect x="1180" y="620" width="16" height="90"/><circle cx="1188" cy="610" r="40" fill="#000"/>
    </g>
    <circle cx="308" cy="590" r="40" fill="#ffb3d1"/>
    <circle cx="1188" cy="610" r="34" fill="#ffb3d1"/>
    <!-- skatista (silhueta simples) -->
    <g fill="#000" transform="translate(720 470)">
      <circle cx="90" cy="20" r="26"/>
      <rect x="70" y="46" width="42" height="120" rx="18"/>
      <rect x="40" y="150" width="150" height="20" rx="10"/>
      <circle cx="70" cy="182" r="16"/><circle cx="160" cy="182" r="16"/>
    </g>
    <!-- moldura preta da marca -->
    <rect x="12" y="12" width="1576" height="876" fill="none" stroke="#000" stroke-width="24"/>
    <!-- textos -->
    <text x="90" y="230" font-family="'Anton','Oswald',Impact,sans-serif" font-size="120" fill="#ffffff" letter-spacing="2">PICO DA</text>
    <text x="90" y="350" font-family="'Anton','Oswald',Impact,sans-serif" font-size="120" fill="#ffffff" letter-spacing="2">NOVA ZOO</text>
    <g transform="translate(90 400)">
      <rect x="0" y="0" width="360" height="52" rx="26" fill="#f6c707"/>
      <text x="26" y="36" font-family="'Oswald',Arial,sans-serif" font-size="30" font-weight="700" fill="#000" letter-spacing="4">PAMPULHA · BH</text>
    </g>
    <text x="90" y="838" font-family="'Oswald',Arial,sans-serif" font-size="24" fill="#000" letter-spacing="2" opacity="0.75">IMAGEM DE EXEMPLO — SUBSTITUIR POR FOTO REAL DO PICO</text>
  </g>
</svg>
