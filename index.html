        /* --- LOGO --- */
        .logo-container {
            width: 320px; /* Logo maior */
            max-width: 90%;
            margin-bottom: 20px;
            animation: fadeIn 1s ease-out;
        }

        .logo-container svg {
            width: 100%;
            height: auto;
            filter: drop-shadow(0px 0px 8px rgba(247, 158, 211, 0.4));
        }

        /* --- FRASE DE EFEITO --- */
        .tagline {
            font-size: 1.2rem;
            text-align: center;
            margin-bottom: 40px;
            color: #fff;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
            max-width: 600px;
        }

        .footer {
            font-size: 1rem;
            text-align: center;
            margin-bottom: 15px;
            color: #fff;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
            max-width: 600px;
        }

        /* --- LINKS (Botões) --- */
        .links-container {
            width: 100%;
            max-width: 450px;
            margin-bottom: 40px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .link-btn {
            display: block;
            text-decoration: none;
            background-color: var(--primary-color);
            color: var(--btn-text);
            padding: 20px;
            text-align: center;
            border-radius: 50px; /* Botão estilo pílula */
            font-weight: bold;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.2s, box-shadow 0.2s, background-color 0.2s;
            position: relative;
            overflow: hidden;
        }

        .link-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
            background-color: #ffffff; /* Fica branco ao passar o mouse */
        }

        /* Efeito de brilho ao clicar */
        .link-btn:active {
            transform: translateY(0);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .logo-container { width: 280px; }
            .tagline { font-size: 1rem; padding: 0 10px; }
            .link-btn { font-size: 1rem; padding: 18px; }
        }
    </style>
</head>
