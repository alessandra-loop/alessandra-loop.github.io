    <!-- Fontes oficiais da marca Loop, self-hosted (latin) — sem folha de
         estilo render-blocking do Google Fonts no caminho crítico.
         Anton = display/títulos, Oswald = rótulos, Barlow = corpo.
         Pré-carrega as fontes de exibição acima da dobra (títulos + botões). -->
    <link rel="preload" href="{{ '/assets/fonts/anton-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="{{ '/assets/fonts/oswald-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>

    <style>

        /* Latin subset comum a todas as fontes da marca (cobre acentos PT-BR). */
        @font-face {
            font-family: 'Anton';
            font-style: normal;
            font-weight: 400;
            font-display: swap;
            src: url("{{ '/assets/fonts/anton-latin.woff2' | relative_url }}") format('woff2');
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }
        @font-face {
            font-family: 'Oswald';
            font-style: normal;
            font-weight: 400 700;
            font-display: swap;
            src: url("{{ '/assets/fonts/oswald-latin.woff2' | relative_url }}") format('woff2');
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }
        @font-face {
            font-family: 'Barlow';
            font-style: normal;
            font-weight: 400;
            font-display: swap;
            src: url("{{ '/assets/fonts/barlow-latin-400.woff2' | relative_url }}") format('woff2');
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }
        @font-face {
            font-family: 'Barlow';
            font-style: normal;
            font-weight: 700;
            font-display: swap;
            src: url("{{ '/assets/fonts/barlow-latin-700.woff2' | relative_url }}") format('woff2');
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }

        :root {
            /* Paleta oficial da marca Loop Skatepark */
            --loop-preto:   #000000;
            --loop-branco:  #ffffff;
            --loop-ciano:   #18d7df;
            --loop-roxo:    #935bbc;
            --loop-rosa:    #ffb3d1;
            --loop-amarelo: #f6c707;
            --loop-bege:    #e8d4bf;

            /* Tipografia da marca */
            --font-display: 'Anton', 'Oswald', 'Bebas Neue', 'Arial Narrow', Impact, sans-serif;
            --font-head:    'Oswald', 'Bebas Neue', 'Arial Narrow', Impact, sans-serif;
            --font-body:    'Barlow', 'Segoe UI', Arial, sans-serif;

            /* Papéis na página */
            --primary-color: var(--loop-rosa); /* Rosa da marca */
            --bg-color:      var(--loop-roxo); /* Roxo da marca */
            --text-color:    var(--loop-branco);
            --btn-text:      var(--loop-preto);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            padding: 20px;
        }

        /* Conteúdo principal cresce para ocupar o espaço livre e mantém-se
           centralizado, empurrando o rodapé para o final da página. */
        .content-main {
            flex: 1 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        /* --- BACKGROUND PATTERN (Skatista) --- */
        body::before {
            content: "";
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            z-index: -1;
            /* SVG do skatista em marca d'água preta com baixa opacidade */
            background-image: url("{{ '/assets/skater-bg.svg' | relative_url }}");
            background-repeat: repeat;
            background-size: 180px;
            transform: rotate(45deg);
            opacity: 0.15;
            pointer-events: none;
        }

        /* --- LOGO --- */
        .logo-container {
            width: 320px; /* Logo maior */
            max-width: 90%;
            margin-bottom: 20px;
            animation: fadeIn 1s ease-out;
        }

        .logo-container svg {
            width: 100%;
            height: auto;
            filter: drop-shadow(0px 0px 8px rgba(247, 158, 211, 0.4));
        }

        /* --- FRASE DE EFEITO (títulos em condensada caixa-alta) --- */
        .tagline {
            text-align: center;
            color: var(--text-color);
            text-transform: uppercase;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
            max-width: 600px;
        }

        /* Título principal: fonte de exibição da marca (Anton) */
        h1.tagline {
            font-family: var(--font-display);
            font-weight: 400; /* Anton só possui o peso 400 — evita bold sintético */
            font-size: 2.4rem;
            line-height: 1.05;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        /* Subtítulo: fonte condensada de apoio (Oswald) */
        h2.tagline {
            font-family: var(--font-head);
            font-weight: 600;
            font-size: 1.15rem;
            letter-spacing: 2px;
            margin-bottom: 40px;
            /* Branco sobre o roxo institucional garante contraste AA (4.7:1);
               o ciano (2.6:1) não atinge o mínimo legível. */
            color: var(--loop-branco);
        }

        /* Rodapé compartilhado (mesmo do Manual) — barra preta de largura total.
           Estende-se até as bordas anulando o padding de 20px do body. */
        footer {
            position: relative;
            width: calc(100% + 40px);
            margin: 60px -20px -20px;
            background: var(--loop-preto);
            color: #bbb;
            text-align: center;
            padding: 64px 24px 40px;
            font-size: 13px;
            border-top: 1px solid #333;
        }
        /* padding-top maior: abre espaço p/ os olhinhos que saltam sobre o footer */
        footer a {
            /* Sublinhado garante que o link seja distinguível do texto cinza
               ao redor sem depender só da cor (contraste ciano×#bbb < 3:1). */
            color: var(--loop-ciano);
            text-decoration: underline;
        }
        /* Olhinhos centralizados na borda superior, saltando 50% para fora */
        .footer-olhinhos {
            position: absolute;
            left: 50%;
            top: 0;
            transform: translate(-50%, -50%);
            width: clamp(90px, 22vw, 150px);
            line-height: 0;
            pointer-events: none;
        }
        .footer-olhinhos svg {
            display: block;
            width: 100%;
            height: auto;
        }

        /* --- LINKS (Botões) --- */
        .links-container {
            width: 100%;
            max-width: 450px;
            margin-bottom: 40px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .link-btn {
            display: block;
            text-decoration: none;
            background-color: var(--primary-color);
            color: var(--btn-text);
            padding: 20px;
            text-align: center;
            border-radius: 50px; /* Botão estilo pílula */
            font-family: var(--font-head); /* Oswald — rótulos condensados */
            font-weight: 700;
            font-size: 1.15rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.2s, box-shadow 0.2s, background-color 0.2s;
            position: relative;
            overflow: hidden;
        }

        .link-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
            background-color: #ffffff; /* Fica branco ao passar o mouse */
        }

        /* Efeito de brilho ao clicar */
        .link-btn:active {
            transform: translateY(0);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .logo-container { width: 280px; }
            .tagline { font-size: 1rem; padding: 0 10px; }
            .link-btn { font-size: 1rem; padding: 18px; }
        }
    </style>

</head>
