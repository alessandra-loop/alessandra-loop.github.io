# Minimal Jekyll config for the Loop Skate Park landing page.
# GitHub Pages builds this automatically.
title: Loop Skate Park
description: Escola de Skate e Patins em Belo Horizonte (BH). Pista coberta, instrutores qualificados e aula experimental gratuita.
url: https://loopskatepark.com.br

# Gera sitemap.xml automaticamente (plugin suportado pelo GitHub Pages).
# Páginas com "sitemap: false" no front matter (ex.: o manual noindex) ficam de fora.
plugins:
  - jekyll-sitemap

# Coleções do Mural da Loop — cada seção é um mini-blog independente.
#   picos   → Dicas de picos (pistas para andar em BH)
#   inspira → Quem inspira o rolê (atleta do mês)
#   cena    → O que está rolando na cena (campeonatos e eventos)
collections:
  picos:
    output: true
    permalink: /mural/picos/:name/
  inspira:
    output: true
    permalink: /mural/inspira/:name/
  cena:
    output: true
    permalink: /mural/cena/:name/

# Mantém TODOS os arquivos da pasta do manual fora do sitemap.xml,
# inclusive quaisquer páginas .html adicionadas no futuro. O jekyll-sitemap
# respeita "sitemap: false"; arquivos estáticos (PDF/PPTX/JS) já não entram no
# sitemap por padrão.
defaults:
  - scope:
      path: "manual-dos-alunos-e-responsaveis"
    values:
      sitemap: false
  # Mural ainda não lançado (sem link na home/rodapé): mantém tudo fora do
  # sitemap e com layout padrão nas coleções. Ao lançar, remover estes escopos
  # (e o <meta robots noindex> das páginas) para indexar o mural.
  - scope:
      path: "mural"
    values:
      sitemap: false
  - scope:
      path: ""
      type: "picos"
    values:
      layout: mural-post
      sitemap: false
  - scope:
      path: ""
      type: "inspira"
    values:
      layout: mural-post
      sitemap: false
  - scope:
      path: ""
      type: "cena"
    values:
      layout: mural-post
      sitemap: false

# Arquivos internos de documentação/ferramenta que não devem ser publicados no
# site nem processados pelo Jekyll. O CLAUDE.md contém exemplos de sintaxe Liquid
# (ex.: "{% include %}") que quebram o build do GitHub Pages se lidos; o script/
# é só ajuda de desenvolvimento local (não faz parte do site).
exclude:
  - CLAUDE.md
  - script
